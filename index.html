<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TicketCine - Cartelera</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Loader splash -->
  <div id="loader-overlay" role="status" aria-label="Cargando sitio">
    <div class="loader-inner">
      <img id="loader-logo" class="loader-logo" src="173 sin título_2026824012952.png" alt="TicketCine logo">
    </div>
    <div class="loader-caption">From Hanna Guzmán</div>
  </div>

  <!-- Header fijo arriba -->
  <header class="site-header">
    <button class="hamburger" aria-label="Abrir menú">☰</button>
    <div class="brand">TICKETCINE</div>
    <button class="user" aria-label="Cuenta">👤</button>
  </header>

  <!-- Carousel: top of the page (under header) -->
  <section id="carousel" class="carousel" aria-label="Carrusel de películas">
    <div class="carousel-wrapper">
      <div class="carousel-track" id="carousel-track" aria-live="polite"></div>
      <button class="carousel-btn prev" id="carousel-prev" aria-label="Anterior">‹</button>
      <button class="carousel-btn next" id="carousel-next" aria-label="Siguiente">›</button>
    </div>
    <div class="carousel-indicators" id="carousel-indicators" aria-hidden="true"></div>
  </section>

  <!-- Filters bar (sticky: will sit below carousel and stick to top when scrolled) -->
  <div class="filters-bar">
    <div class="filters-inner">
      <div class="filter-left">
        <button class="filter-btn">📍 Elegí cine ▾</button>
      </div>
      <div class="filter-right">
        <button class="filter-btn">🎬 Elegí película ▾</button>
      </div>
    </div>
    <div class="filters-separator" aria-hidden="true"></div>
  </div>

  <!-- Main content -->
  <main class="main-content">
    <!-- Section header -->
    <section class="cartelera">
      <div class="cartelera-header">
        <h1 class="section-title">PELÍCULAS EN CARTELERA</h1>
        <button class="highlight-badge"><span class="smile">😊</span> DESTACADO</button>
      </div>

      <!-- Subfilters -->
      <div class="subfilters">
        <button class="subfilter">Formatos ▾</button>
        <button class="subfilter">Idioma ▾</button>
        <button class="subfilter">Otras opciones ▾</button>
      </div>

      <!-- Gallery grid -->
      <div id="gallery-grid" class="gallery-grid" aria-live="polite"></div>
    </section>
  </main>

  <!-- Player modal / inline player (hidden by default). Opens when user clicks poster -->
  <div id="player-overlay" class="player-overlay" aria-hidden="true">
    <div class="player-backdrop" id="player-backdrop"></div>
    <div class="player-container" role="dialog" aria-modal="true" aria-label="Reproductor de tráiler">
      <button id="player-close" class="player-close" aria-label="Cerrar">✕</button>
      <div class="player-video">
        <iframe id="player-iframe" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen title="Trailer"></iframe>
      </div>
      <hr class="player-sep">
      <div class="player-schedule">
        <h3>HORARIO</h3>
        <div id="schedule-columns" class="schedule-columns"></div>
      </div>
    </div>
  </div>

  <!-- Buy modal (estilo Cinemark) -->
  <div id="buy-overlay" class="buy-overlay" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Comprar entradas">
    <div class="buy-backdrop" id="buy-backdrop"></div>
    <div class="buy-container">
      <button id="buy-close" class="buy-close" aria-label="Cerrar compra">✕</button>

      <div class="buy-header">
        <h3 id="buy-title">Título de la película</h3>
        <span id="buy-rating" class="buy-rating-badge">TP</span>
      </div>

      <div class="buy-schedule-info">
        <span class="buy-schedule-icon">🕒</span>
        <span id="buy-info">Día y horario seleccionados</span>
      </div>

      <hr class="buy-sep">

      <form id="buy-form" class="buy-form" aria-label="Formulario de compra">

        <div class="form-section">
          <h4 class="form-section-title">TIPO DE ENTRADA</h4>
          <div id="ticket-type-options" class="ticket-type-options"></div>
        </div>

        <div class="form-section">
          <h4 class="form-section-title">CANTIDAD DE ENTRADAS</h4>
          <div class="qty-stepper">
            <button type="button" id="qty-minus" class="qty-btn" aria-label="Restar entrada">−</button>
            <span id="buy-qty-display" class="qty-display">1</span>
            <button type="button" id="qty-plus" class="qty-btn" aria-label="Sumar entrada">+</button>
          </div>
        </div>

        <div class="form-section total-section">
          <div class="total-line">
            <span>Precio por entrada</span>
            <strong id="buy-price">$120</strong>
          </div>
          <div class="total-line total-line-main">
            <span>Total</span>
            <strong id="buy-total">$120</strong>
          </div>
        </div>

        <div class="buy-actions">
          <button id="buy-proceed" class="buy-proceed" type="button">Siguiente</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Success overlay -->
  <div id="success-overlay" class="success-overlay" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Compra exitosa">
    <div class="success-backdrop" id="success-backdrop"></div>
    <div class="success-container">
      <button id="success-close" class="success-close" aria-label="Cerrar">✕</button>
      <h2 id="success-title">Felicitaciones por su compra</h2>
      <p id="success-sub" class="muted">¿Listo para la aventura? Te enviamos el Ticket de compra a su email</p>
    </div>
  </div>

  <!-- Floating quick-buy button -->
  <button id="quick-buy" class="quick-buy">⚡ COMPRA RÁPIDA ▾</button>

  <script src="script.js"></script>
</body>
</html>
