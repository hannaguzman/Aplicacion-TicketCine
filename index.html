<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TicketCine - Cartelera</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Header fijo arriba -->
  <header class="site-header fixed">
    <div class="header-inner">
      <button class="hamburger" aria-label="Abrir menú">☰</button>
      <div class="brand">TICKETCINE</div>
      <div class="header-actions">
        <button class="user" aria-label="Cuenta">👤</button>
      </div>
    </div>
  </header>

  <!-- Barra de filtros justo debajo del header -->
  <div class="filters-bar">
    <div class="filters-inner">
      <div class="filter-left">
        <button class="filter-btn">📍 Elegí cine ▾</button>
      </div>
      <div class="filter-right">
        <button class="filter-btn">🎬 Elegí película ▾</button>
      </div>
    </div>
    <div class="filters-separator" aria-hidden="true"></div>
  </div>

  <main class="content">
    <!-- Sección Cartelera -->
    <section id="cartelera" class="cartelera">
      <div class="cartelera-header">
        <h2 class="section-title">PELÍCULAS EN CARTELERA</h2>
        <div class="highlight-badge"><span class="smile">😊</span> DESTACADO</div>
      </div>

      <!-- Sub-filtros (formatos, idioma, otras opciones) -->
      <div class="subfilters">
        <button class="subfilter">Formatos ▾</button>
        <button class="subfilter">Idioma ▾</button>
        <button class="subfilter">Otras opciones ▾</button>
      </div>

      <!-- Grid de películas 2 columnas -->
      <div id="movies-grid" class="movies-grid" aria-live="polite">
        <!-- tarjetas generadas por script.js -->
      </div>
    </section>
  </main>

  <!-- Botón flotante compra rápida -->
  <button id="quick-buy" class="quick-buy">⚡ COMPRA RÁPIDA ▾</button>

  <footer class="site-footer">
    <p>&copy; TicketCine</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
