<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TicketCine - Reserva de entradas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Loader splash: centered logo with immediate hide handled in JS -->
  <div id="loader-overlay" role="status" aria-label="Cargando sitio">
    <div class="loader-inner">
      <img class="loader-logo" src="173 sin título_20260824012952.png" alt="Logo" aria-hidden="true">
    </div>
    <div class="loader-caption">From Hanna Guzmán</div>
  </div>

  <!-- Header (Cinemark-like centered brand) -->
  <header class="site-header">
    <div class="header-inner">
      <button class="hamburger" aria-label="Abrir menú">☰</button>
      <div class="brand">TICKETCINE</div>
      <div class="header-actions">
        <button class="user">👤</button>
      </div>
    </div>
    <div class="selectors">
      <div class="select">
        <button class="select-btn">ELEGÍ CINE ▾</button>
      </div>
      <div class="select">
        <button class="select-btn">ELEGÍ PELÍCULA ▾</button>
      </div>
    </div>
  </header>

  <!-- Carousel slider (one image at a time) -->
  <section id="carousel" class="carousel" aria-label="Carrusel de películas">
    <div class="carousel-wrapper">
      <div class="carousel-track" id="carousel-track" aria-live="polite">
        <!-- slides injected by JS -->
      </div>
      <button class="carousel-btn prev" id="carousel-prev" aria-label="Anterior">‹</button>
      <button class="carousel-btn next" id="carousel-next" aria-label="Siguiente">›</button>
    </div>
    <div class="carousel-indicators" id="carousel-indicators" aria-hidden="true"></div>
  </section>

  <!-- Main content (listing + reservation) -->
  <main>
    <section class="list-section">
      <div class="section-header">
        <h2>PELÍCULAS EN CARTELERA</h2>
        <span class="badge">DESTACADO</span>
      </div>

      <div id="movies-container" class="cards"></div>
    </section>

    <aside id="reservation-panel">
      <h2>Reserva</h2>
      <div id="selected-movie">Selecciona una película</div>
      <div id="showtimes" class="controls"></div>
      <label for="quantity">Cantidad de entradas</label>
      <input type="number" id="quantity" min="1" value="1">
      <button id="confirm-btn" disabled>Confirmar reserva</button>
      <div id="success-message" class="hidden">
        <h3>Reserva confirmada</h3>
        <p id="confirmation-text"></p>
      </div>
    </aside>
  </main>

  <footer>
    <p>&copy; TicketCine</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
